<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">ArthroSkill-MC method overview</title>
<desc id="desc">Appearance and instrument motion branches meet in confidence-masked cross-attention, followed by procedure-level grade and GRS aggregation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#516579"/></marker></defs>
<rect width="1100" height="610" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172b40">
<text x="35" y="38" font-size="23" font-weight="700">ArthroSkill-MC: occlusion-aware multimodal assessment</text>
<rect x="35" y="227" width="180" height="86" rx="10" fill="#e5eef8" stroke="#7991aa"/>
<text x="125.0" y="265.5" text-anchor="middle" font-size="16">16-frame</text>
<text x="125.0" y="286.5" text-anchor="middle" font-size="16">arthroscopic clip</text>
<rect x="275" y="95" width="255" height="75" rx="10" fill="#e5eef8" stroke="#7991aa"/>
<text x="402.5" y="128.0" text-anchor="middle" font-size="16">3D Video Swin-T</text>
<text x="402.5" y="149.0" text-anchor="middle" font-size="16">appearance encoder</text>
<rect x="275" y="230" width="255" height="75" rx="10" fill="#e5eef8" stroke="#7991aa"/>
<text x="402.5" y="263.0" text-anchor="middle" font-size="16">YOLOv8 + DeepSORT</text>
<text x="402.5" y="284.0" text-anchor="middle" font-size="16">instrument trajectories</text>
<rect x="275" y="365" width="255" height="75" rx="10" fill="#e5eef8" stroke="#7991aa"/>
<text x="402.5" y="398.0" text-anchor="middle" font-size="16">Six kinematic descriptors</text>
<text x="402.5" y="419.0" text-anchor="middle" font-size="16">CNN + bidirectional LSTM</text>
<rect x="605" y="230" width="235" height="95" rx="10" fill="#dcefe9" stroke="#7991aa"/>
<text x="722.5" y="262.5" text-anchor="middle" font-size="16">Confidence-masked</text>
<text x="722.5" y="283.5" text-anchor="middle" font-size="16">cross-modal attention</text>
<text x="722.5" y="304.5" text-anchor="middle" font-size="16">threshold: 0.5</text>
<rect x="605" y="95" width="235" height="75" rx="10" fill="#dcefe9" stroke="#7991aa"/>
<text x="722.5" y="128.0" text-anchor="middle" font-size="16">Appearance residual</text>
<text x="722.5" y="149.0" text-anchor="middle" font-size="16">all-invalid fallback</text>
<rect x="900" y="230" width="165" height="95" rx="10" fill="#dcefe9" stroke="#7991aa"/>
<text x="982.5" y="273.0" text-anchor="middle" font-size="16">Fused</text>
<text x="982.5" y="294.0" text-anchor="middle" font-size="16">representation</text>
<rect x="580" y="490" width="230" height="80" rx="10" fill="#fff0d8" stroke="#7991aa"/>
<text x="695.0" y="515.0" text-anchor="middle" font-size="16">Grade probabilities</text>
<text x="695.0" y="536.0" text-anchor="middle" font-size="16">mean per procedure</text>
<text x="695.0" y="557.0" text-anchor="middle" font-size="16">then argmax</text>
<rect x="845" y="490" width="230" height="80" rx="10" fill="#fff0d8" stroke="#7991aa"/>
<text x="960.0" y="515.0" text-anchor="middle" font-size="16">Six GRS dimensions</text>
<text x="960.0" y="536.0" text-anchor="middle" font-size="16">and separate total</text>
<text x="960.0" y="557.0" text-anchor="middle" font-size="16">mean total per procedure</text>
<polyline points="215,245 245,245 245,132 275,132" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="215,270 275,270" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="402,305 402,365" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="530,132 570,132 570,247 605,247" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="545" y="207" font-size="14" fill="#43576c">queries</text>
<polyline points="530,402 560,402 560,306 605,306" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="450" y="465" font-size="14" fill="#43576c">keys / values</text>
<polyline points="530,268 605,268" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="532" y="253" font-size="14" fill="#43576c">confidence</text>
<polyline points="530,115 605,115" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="840,132 983,132 983,230" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="840,280 900,280" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="983,325 983,458 695,458 695,490" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<polyline points="983,458 960,458 960,490" fill="none" stroke="#516579" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="35" y="590" font-size="14" fill="#43576c">Procedure-level outputs preserve the fixed partition and LOSO evaluation protocols.</text></g></svg>
