name: Reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '3407'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the matched CPU PyTorch wheels
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install all pinned validation dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check
      - name: Fetch and verify the pinned official SAIS source
        run: python scripts/setup_sais.py --destination external/SAIS
      - name: Run tests with the real official SAIS temporal model
        run: |
          mkdir -p outputs
          python -m unittest discover -s tests -v 2>&1 | tee outputs/tests.log
      - name: Recompute and compare every current-source analysis field
        run: python scripts/quickstart.py --output outputs/quickstart
      - name: Exercise synthetic SAIS training and checkpoint evaluation
        run: python scripts/smoke_test.py --sais-root external/SAIS --output outputs/smoke
      - name: Retain numerical verification and runtime records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-reproducibility
          path: |
            outputs/tests.log
            outputs/quickstart/*.json
            outputs/smoke/smoke_report.json
          if-no-files-found: warn
