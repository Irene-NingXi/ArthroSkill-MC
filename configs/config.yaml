# ArthroSkill-MC configuration

data:
  video_dir: "./videos"
  output_dir: "./processed"
  clip_len: 16
  img_size: [480, 640]
  fps: 25
  brightness_threshold: 30
  blur_threshold: 100
  num_classes: 3
  grs_dimensions: 6
  skill_levels: ["novice", "intermediate", "expert"]
  grs_total_min: 6
  grs_total_max: 30

model:
  appearance:
    backbone: "swin3d_t"
    output_dim: 768
    pretrained: true
    checkpoint: null  # Set to the HeiChole-adapted backbone state dictionary.
  motion:
    detector: "yolov8n"
    conf_threshold: 0.5
    cnn_channels: [64, 128, 256]
    cnn_kernels: [7, 5, 3]
    lstm_hidden: 128
    lstm_layers: 1
    output_dim: 256
  fusion:
    num_heads: 8
    dropout: 0.1
  heads:
    classification:
      hidden_dim: 512
      dropout: 0.3
    regression:
      hidden_dim: 512
      dropout: 0.3
      num_dimensions: 6
      predict_total: true

training:
  batch_size: 4
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05
  optimizer: "adamw"
  scheduler: "cosine"
  warmup_epochs: 5
  lambda_reg: 1.0
  label_smoothing: 0.0
  device: "auto"
  num_workers: 4
  seed: 3407
  repeat_seeds: [3407, 3433, 2025]
  split_seed: 20241012
  augmentation:
    random_crop: true
    horizontal_flip: true
    color_jitter: 0.2

evaluation:
  metrics: ["accuracy", "pearson_r", "mae", "rmse", "icc", "confusion_matrix"]
  calibration_bins: 5
